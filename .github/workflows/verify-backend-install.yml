# =============================================================================
# VERIFY BACKEND INSTALL — kiểm thử cô lập các bước cài đặt Backend
# Khớp tài liệu: docs/INSTALL_BACKEND.md
# Phạm vi: JDK/Maven, .env, MySQL, Redis, shared, smoke-build Java services
# Không gồm: Frontend npm, START.ps1 (Windows-only)
# =============================================================================

name: Verify Backend Install

on:
  push:
    branches: [main, master, develop]
    paths:
      - ".github/workflows/verify-backend-install.yml"
      - "shared/**"
      - "discovery-server/**"
      - "config-server/**"
      - "api-gateway/**"
      - "auth-service/**"
      - "user-service/**"
      - "catalog-service/**"
      - "cart-service/**"
      - "order-service/**"
      - "review-service/**"
      - "statistics-service/**"
      - "chatbot-service/**"
      - "docker-compose.yml"
      - ".env.example"
      - "database/schemas/**"
      - "scripts/Import-Databases.ps1"
      - "scripts/Start-Redis.ps1"
      - "docs/INSTALL_BACKEND.md"
  pull_request:
    branches: [main, master, develop]
    paths:
      - ".github/workflows/verify-backend-install.yml"
      - "shared/**"
      - "discovery-server/**"
      - "config-server/**"
      - "api-gateway/**"
      - "auth-service/**"
      - "user-service/**"
      - "catalog-service/**"
      - "cart-service/**"
      - "order-service/**"
      - "review-service/**"
      - "statistics-service/**"
      - "chatbot-service/**"
      - "docker-compose.yml"
      - ".env.example"
      - "database/schemas/**"
      - "docs/INSTALL_BACKEND.md"
  workflow_dispatch:

concurrency:
  group: verify-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-install:
    name: Backend environment & build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      redis-auth:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      redis-statistics:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: "1. Checkout source"
        uses: actions/checkout@v5

      - name: "2. Verify required project layout"
        run: |
          set -euo pipefail
          for f in START.ps1 STOP.ps1 docker-compose.yml .env.example; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          for d in shared discovery-server config-server api-gateway auth-service \
                   user-service catalog-service cart-service order-service \
                   review-service statistics-service chatbot-service \
                   scripts database/schemas; do
            test -d "$d" || { echo "MISSING DIR: $d"; exit 1; }
          done
          test -f shared/pom.xml
          echo "Backend layout OK"

      - name: "3. Setup Java 17 + Maven"
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: "4. Install MySQL/Redis clients"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client redis-tools

      - name: "5. Print toolchain versions (doc: chuẩn bị môi trường)"
        run: |
          java -version
          mvn -version
          mysql --version
          redis-cli --version

      - name: "6. Create .env from .env.example"
        run: |
          cp .env.example .env
          sed -i 's/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=root/' .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci_jwt_secret_min_32_chars_electro_store/' .env
          grep -E '^(MYSQL_|AUTH_REDIS_|STATISTICS_REDIS_|JWT_SECRET)' .env || true
          echo ".env created"

      - name: "7. Wait for MySQL"
        run: |
          for i in $(seq 1 40); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL UP"
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: "8. Import schemas (equiv. Import-Databases.ps1)"
        run: |
          set -euo pipefail
          SCHEMA_DIR=database/schemas
          for db in electro_user_db electro_catalog_db electro_cart_db \
                    electro_order_db electro_review_db electro_statistics_db; do
            echo "-> $db"
            mysql -h 127.0.0.1 -uroot -proot -e \
              "CREATE DATABASE IF NOT EXISTS \`$db\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            if [ -f "$SCHEMA_DIR/$db" ]; then
              mysql -h 127.0.0.1 -uroot -proot "$db" < "$SCHEMA_DIR/$db"
            elif [ -f "$SCHEMA_DIR/$db.sql" ]; then
              mysql -h 127.0.0.1 -uroot -proot "$db" < "$SCHEMA_DIR/$db.sql"
            else
              echo "Missing dump: $db"; exit 1
            fi
          done
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW DATABASES LIKE 'electro_%';"

      - name: "9. Verify Redis auth:6379 + statistics:6380"
        run: |
          redis-cli -h 127.0.0.1 -p 6379 ping | grep PONG
          redis-cli -h 127.0.0.1 -p 6380 ping | grep PONG

      - name: "10. Build shared module"
        run: mvn -f shared/pom.xml install -DskipTests -B

      - name: "11. Smoke-build core Java services"
        run: |
          set -euo pipefail
          for svc in discovery-server config-server auth-service user-service \
                     catalog-service cart-service order-service review-service \
                     statistics-service chatbot-service api-gateway; do
            echo "======== $svc ========"
            mvn -f "$svc/pom.xml" package -DskipTests -B
          done

      - name: "12. Backend install verification PASSED"
        run: |
          echo "============================================"
          echo " VERIFY BACKEND INSTALL: PASS"
          echo " Doc : docs/INSTALL_BACKEND.md"
          echo " Next: on Windows run .\\START.ps1 locally"
          echo "============================================"
