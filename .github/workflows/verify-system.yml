# Kiểm thử cô lập các bước cài đặt hệ thống Electro Store
# Khớp tài liệu: .env → MySQL/Redis → shared → frontend → reco-service
#
# Lưu ý: START.ps1 dành cho Windows local; trên CI ta kiểm tra các bước
# portable tương đương (Maven shared, npm, pip, import schema).

name: Kiem Thu He Thong Co Lap

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  verify-installation:
    name: Verify installation steps
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      redis-auth:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      redis-statistics:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Tai ma nguon ve may ao
        uses: actions/checkout@v4

      - name: Kiem tra cau truc thu muc bat buoc
        run: |
          set -e
          test -f START.ps1
          test -f STOP.ps1
          test -f docker-compose.yml
          test -f .env.example
          test -d shared
          test -d frontend
          test -d reco-service
          test -d scripts
          test -d database/schemas
          test -f shared/pom.xml
          test -f reco-service/requirements.txt
          test -f reco-service/main.py
          test -f frontend/package.json
          echo "Cau truc thu muc OK"

      - name: Cai dat Java 17 va Maven
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Cai dat Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cai dat Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: reco-service/requirements.txt

      - name: Cai client MySQL va Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client redis-tools

      - name: Kiem tra phien ban moi truong
        run: |
          java -version
          mvn -version
          node -v
          npm -v
          python --version
          mysql --version
          redis-cli --version

      # --- Bước 2 tài liệu: .env + hạ tầng ---
      - name: Tao file .env tu .env.example
        run: |
          cp .env.example .env
          sed -i 's/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=root/' .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci_jwt_secret_min_32_chars_electro_store/' .env
          test -f .env
          echo "Da tao .env"

      - name: Doi MySQL san sang
        run: |
          for i in $(seq 1 40); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL UP"
              exit 0
            fi
            echo "Cho MySQL... ($i)"
            sleep 3
          done
          echo "MySQL khong san sang"
          exit 1

      - name: Import schema database (tuong duong Import-Databases.ps1)
        run: |
          set -e
          SCHEMA_DIR=database/schemas
          for db in electro_user_db electro_catalog_db electro_cart_db electro_order_db electro_review_db electro_statistics_db; do
            echo "-> $db"
            mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS \`$db\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            if [ -f "$SCHEMA_DIR/$db" ]; then
              mysql -h 127.0.0.1 -uroot -proot "$db" < "$SCHEMA_DIR/$db"
            elif [ -f "$SCHEMA_DIR/$db.sql" ]; then
              mysql -h 127.0.0.1 -uroot -proot "$db" < "$SCHEMA_DIR/$db.sql"
            else
              echo "Khong tim thay dump cho $db"
              exit 1
            fi
          done
          mysql -h 127.0.0.1 -uroot -proot -e "SHOW DATABASES LIKE 'electro_%';"
          echo "Import schema OK"

      - name: Kiem tra Redis (auth 6379, statistics 6380)
        run: |
          redis-cli -h 127.0.0.1 -p 6379 ping | grep PONG
          redis-cli -h 127.0.0.1 -p 6380 ping | grep PONG

      # --- Bước 3 tài liệu: build shared ---
      - name: Build module shared (mvn install)
        run: mvn -f shared/pom.xml install -DskipTests -B

      - name: Smoke-build mot so service cot loi
        run: |
          set -e
          for svc in discovery-server config-server auth-service api-gateway; do
            echo "=== Build $svc ==="
            mvn -f "$svc/pom.xml" package -DskipTests -B
          done

      # --- Reco-service (Python FastAPI) ---
      - name: Cai dat thu vien reco-service
        working-directory: reco-service
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kiem tra import FastAPI app reco-service
        working-directory: reco-service
        run: |
          cp .env.example .env
          python -c "from main import app; print('reco-service app OK:', app.title)"

      # --- Frontend (React + Vite) ---
      - name: Cai dat va build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Tong ket
        run: |
          echo "========================================"
          echo " Verify installation: PASS"
          echo " - .env tu .env.example"
          echo " - MySQL schema electro_*_db"
          echo " - Redis :6379 / :6380"
          echo " - shared + discovery/config/auth/gateway"
          echo " - reco-service requirements + import app"
          echo " - frontend npm ci + build"
          echo "========================================"
