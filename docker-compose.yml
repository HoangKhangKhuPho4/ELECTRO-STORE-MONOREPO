# Electro Store — hạ tầng (MySQL + Zipkin). Redis chạy STANDALONE (không gom Compose).
# Microservices Java chạy local qua START.ps1.
#
# Khởi động MySQL/Zipkin:  docker compose up -d
# Redis riêng (2 container độc lập):  .\scripts\Start-Redis.ps1
# Dừng Redis:  .\scripts\Start-Redis.ps1 -Down
# Zipkin UI:   http://localhost:9411
#
# Redis Cache Per Service (docker run standalone — hiện riêng trên Docker Desktop):
#   auth-service        -> redis-auth        :6379  volume redis-auth-data
#   statistics-service  -> redis-statistics  :6380  volume redis-statistics-data

services:
  mysql:
    image: mysql:8.0
    container_name: electro-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - electro_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Redis KHÔNG định nghĩa ở đây — dùng .\scripts\Start-Redis.ps1
  # để Docker Desktop hiện 2 container độc lập (không gộp dưới electro-store-mi...).

  zipkin:
    image: openzipkin/zipkin:2.24
    container_name: electro-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"

volumes:
  electro_mysql_data:
