spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
  data:
    redis:
      # Redis rieng: container redis-auth :6379 — xem .env / Start-Redis.ps1
      host: ${AUTH_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${AUTH_REDIS_PORT:${REDIS_PORT:6379}}
      username: ${AUTH_REDIS_USERNAME:${REDIS_USERNAME:}}
      password: ${AUTH_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      ssl:
        enabled: ${AUTH_REDIS_SSL:${REDIS_SSL:false}}
      timeout: 10s

server:
  port: 8081

# Eureka: localhost (tránh DESKTOP-*.mshome.net → Gateway UnknownHostException, login 500)
eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 1 day access token
  refresh-expiration: 604800000 # 7 days refresh token


management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    configs:
      default:
        timeout-duration: 8s
